name: DevPilot AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-api-tests:
    name: Backend & Target API Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r sample-api/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Sample Target API Tests
        run: |
          pytest sample-api/tests -v --cov=sample-api/app --cov-report=term-missing

      - name: Run DevPilot AI Backend Tests
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=term-missing --cov-report=xml

  frontend-build:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend Bundle
        working-directory: frontend
        run: npm run build
