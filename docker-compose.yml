version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: devpilot-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=DevPilot AI
      - DATABASE_URL=sqlite+aiosqlite:///devpilot.db
      - ALLOWED_TARGET_HOSTS=["localhost", "127.0.0.1", "sample-api", "testserver"]
      - GROQ_API_KEY=${GROQ_API_KEY:-""}
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:80", "http://127.0.0.1:3000"]
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - sample-api

  sample-api:
    build:
      context: .
      dockerfile: sample-api/Dockerfile
    container_name: devpilot-sample-api
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: devpilot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
